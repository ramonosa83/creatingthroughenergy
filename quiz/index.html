.preview .row span { min-width: 4.2rem; }
.chip {

  padding: .25rem .75rem;

}

@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.sig { font: italic 500 1.7rem/1.1 var(--display); color: var(--gold); }
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--panel); border: 1px solid var(--line); margin-top: .4rem; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.foot { font-size: .7rem; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .screen, .saywrap::before { animation: none; }
  .bar i, .btn, .choice { transition: none; }
}

    return h("section", { class: "screen" },
      h("h1", { tabindex: "-1" }, item.q),
      h("div", { class: "choices" }, state.order[i].map(function (v) {
        return h("button", { class: "choice", type: "button", "aria-pressed": state.answers[i] === v ? "true" : "false",
          onclick: pickThenAdvance(function () { state.answers[i] = v; }) }, item.a[v]);
      })),
      i > 0 ? backBtn() : null);
  }

  function bodyScreen() {
    var after = h("div", { class: "screen", hidden: !state.said },
      h("p", null, "Mine goes straight to my chest. Where did yours go?"),
      h("div", { class: "choices" }, BODY.map(function (o) {
        return h("button", { class: "choice", type: "button", "aria-pressed": state.body === o.id ? "true" : "false",
          onclick: pickThenAdvance(function () { state.body = o.id; }) }, o.label);
      })));
    var saidBtn = h("div", { class: "actions", hidden: state.said },
      h("button", { class: "btn", type: "button", onclick: function () {
        state.said = true; saidBtn.hidden = true; after.hidden = false;
        var first = after.querySelector(".choice"); if (first) first.focus({ preventScroll: true });
        after.scrollIntoView({ block: "nearest", behavior: "smooth" });
      } }, "I said it"));
    return h("section", { class: "screen" },
      h("h1", { tabindex: "-1" }, "Now one thing that isn’t a question."),
      h("p", null, "Say this out loud. Actually out loud."),
      h("div", { class: "saywrap" }, h("p", { class: "say" }, "“" + SAY + "”")),
      saidBtn, after, backBtn());
  }

  function sentenceScreen() {
    var err = h("p", { class: "error", role: "alert", hidden: true }, "Type one line to finish the sentence.");
    var left = h("span", null, "");
    var box = h("textarea", { id: "f-sentence", maxlength: "140", rows: "3", "aria-describedby": "f-sentence-help",
      oninput: function () { state.sentence = box.value; left.textContent = box.value.length + " / 140"; err.hidden = true; } });
    box.value = state.sentence;
    left.textContent = box.value.length + " / 140";
    function next(ev) {
      ev.preventDefault();
      state.sentence = box.value.trim();
      if (!state.sentence) { err.hidden = false; box.focus(); return; }
      go(state.step + 1);
    }
    return h("form", { class: "screen", novalidate: true, onsubmit: next },
      h("h1", { tabindex: "-1" }, "Last one about you. Finish this sentence in your own words."),
      h("div", { class: "field" },
        h("label", { for: "f-sentence", class: "stem" }, "“The thing I keep almost doing is…”"),
        box,
        h("div", { class: "under" }, h("span", { id: "f-sentence-help" }, "One line is plenty. You’ll see it again on your result."), left)),
      err,
      h("div", { class: "actions" }, h("button", { class: "btn", type: "submit" }, "Next")),
      backBtn());
  }

  function nextScreen() {
    return h("section", { class: "screen" },
      h("h1", { tabindex: "-1" }, "So I can point you to the right next step: right now, do you earn income from something of your own?"),
      h("div", { class: "choices" }, NEXT.map(function (o) {
        return h("button", { class: "choice", type: "button", "aria-pressed": state.business === o.id ? "true" : "false",
          onclick: pickThenAdvance(function () { state.business = o.id; }) }, o.label);
      })),
      backBtn());
  }

  function gateScreen() {
    var err = h("p", { class: "error", role: "alert", hidden: true }, "");
    var name = h("input", { id: "f-name", type: "text", autocomplete: "given-name", autocapitalize: "words" });
    var email = h("input", { id: "f-email", type: "email", autocomplete: "email", inputmode: "email", autocapitalize: "off" });
    name.value = state.name; email.value = state.email;
    var btn = h("button", { class: "btn", type: "submit" }, "Show me my veto");
    // spam trap: people never see or fill this field, so anything in it means a bot
    var trap = h("input", { id: "f-website", type: "text", tabindex: "-1", autocomplete: "off", "aria-hidden": "true", hidden: true });
    function submit(ev) {
      ev.preventDefault();
      if (trap.value) { go(RESULT_STEP); return; }
      var n = name.value.trim(), e = email.value.trim();
      if (!n) { err.textContent = "Add your first name."; err.hidden = false; name.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) { err.textContent = "That email doesn’t look right. Check it and try again."; err.hidden = false; email.focus(); return; }
      state.name = n; state.email = e; state.sampleVeto = null; state.forceClose = null;
      btn.disabled = true; btn.textContent = "Opening your result…";
      send(payload()).then(function () { go(RESULT_STEP); });
    }
    return h("form", { class: "screen", novalidate: true, onsubmit: submit },
      h("h1", { tabindex: "-1" }, "Your result is ready."),
      h("p", null, "Where should I send it?"),
      h("div", { class: "field" }, h("label", { for: "f-name" }, "First name"), name),
      h("div", { class: "field" }, h("label", { for: "f-email" }, "Email"), email),
      trap, err,
      h("div", { class: "actions" }, btn),
      h("p", { class: "quiet" }, "You’ll see your result right away. You’ll also get my emails. Unsubscribe anytime."),
      backBtn());
  }

  /* ---------- result ---------- */
  function outcome() {
    var r = state.sampleVeto
      ? { veto: state.sampleVeto, second: SAMPLE.second[state.sampleVeto], scores: null }
      : rank(state.answers);
    r.close = state.forceClose || (state.business === "yes" ? "C" : "A");
    return r;
  }
  function bodyLine() {
    var lead = "And when you said “more money than I’ve ever had is on its way to me” out loud, ";
    if (state.body === "none") return null;
    if (state.body === "chest" || state.body === "throat" || state.body === "belly") {
      return h("p", null, lead + "you felt it in your " + state.body + ". That wasn’t doubt. That was the veto.");
    }
    return h("p", null, lead + "your body answered. That wasn’t doubt. That was the veto.");
  }
  function link(label, url, ghost) {
    return h("a", { class: "btn" + (ghost ? " ghost" : ""), href: url, target: "_blank", rel: "noopener" }, label);
  }
  function resetPlayer() {
    if (!CONFIG.embedVideo) return link("Play the Reset", "https://www.youtube.com/watch?v=" + CONFIG.resetVideoId, true);
    return h("div", { class: "video" }, h("iframe", {
      src: "https://www.youtube-nocookie.com/embed/" + CONFIG.resetVideoId + "?rel=0&modestbranding=1&playsinline=1",
      title: "The 5-Minute Nervous System Reset", loading: "lazy", allowfullscreen: true,
      allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share",
      referrerpolicy: "strict-origin-when-cross-origin"
    }));
  }
  function closing(o) {
    var top = [
      h("h2", null, "What this page can’t tell you"),
      h("p", null, "This result tells you which veto your body is running. It can’t tell you your version of it."),
      h("p", null, "Where it got installed. Where it’s costing you right now. What order to take it apart in.")
    ];
    var sign = [h("p", null, "Rooting for you."), h("p", { class: "sig" }, "Ramon")];
    if (o.close === "C") {
      return h("section", { class: "offer" }, top,
        h("p", null, "You told me you already have something you’re building. That means this veto is sitting right on top of your income."),
        h("p", null, "If you’d like help with that, you can book a Roadblock Assessment with me. It’s 45 minutes. We find where your body is saying no, and whether I’m the right person to help you change it."),
        link("Book my Roadblock Assessment", CONFIG.callUrl), sign);
    }
    return h("section", { class: "offer" }, top,
      o.second ? h("p", null, "Your answers also pointed to the " + NAMES[o.second] + ". It’s quieter, but it’s there, and the way the two work together is particular to you.") : null,
      h("p", null, "You’ve had plenty of good information over the years. It was written for everyone. Your nervous system isn’t everyone’s."),
      h("p", null, "That’s why I make the Safety Blueprint. You answer a set of questions, and I build your map by hand: 10 to 15 written pages, plus a video where I walk you through it myself."),
      h("p", null, "It’s $149. If you’d like me to map yours, here’s how it works."),
      link("Show me the Safety Blueprint", CONFIG.blueprintUrl + "#" + SLUG[o.veto]), sign);
  }
  function resultScreen() {
    var o = outcome(), r = RESULTS[o.veto];
    return h("article", { class: "screen" },
      h("p", { class: "lede" }, "Your result"),
      h("h1", { tabindex: "-1" }, state.name + ", your body is running ", h("em", null, "the " + NAMES[o.veto] + ".")),
      h("div", { class: "letter" },
        h("p", null, r.open),
        h("h2", null, "You probably know these moments."),
        ps(r.moments, "moment"),
        ps(r.tell),
        h("h2", null, "You told me the thing you keep almost doing is:"),
        h("p", { class: "own" }, "“" + state.sentence + "”"),
        h("p", null, r.ask),
        bodyLine(),
        h("h2", null, "Why the work you’ve done hasn’t moved this"),
        r.why.map(function (b) { return b.said ? h("p", { class: "said" }, b.said) : h("p", null, b.p); }),
        h("p", null, DOMINO),
        h("h2", null, "This is protection, not a flaw"),
        ps(r.protect),
        h("section", { class: "letter reset" },
          h("h2", null, "Your first tool"),
          h("p", null, "You can’t talk a veto out of voting. Your body needs a different experience, not a better argument."),
          h("p", null, "Start with the 5-Minute Nervous System Reset. Five minutes. Body first."),
          h("p", null, r.reset),
          resetPlayer())),
      closing(o));
  }

  /* ---------- what gets sent with every submission ---------- */
  function payload() {
    var o = outcome();
    return {
      _subject: "Veto Quiz: " + NAMES[o.veto] + " (" + state.name + ")",
      first_name: state.name, email: state.email,
      veto: NAMES[o.veto], tag: "veto-" + SLUG[o.veto], second_veto: o.second ? NAMES[o.second] : "",
      score_visibility: o.scores ? o.scores.V : "", score_loyalty: o.scores ? o.scores.L : "", score_ease: o.scores ? o.scores.E : "",
      answers: SCORED.map(function (it, i) { return (i + 1) + ". " + it.q + " > " + (state.answers[i] ? it.a[state.answers[i]] : ""); }).join("\n"),
      felt_it_in: state.body || "", their_sentence: state.sentence,
      has_business: state.business || "", next_step: { A: "Safety Blueprint", C: "Roadblock Assessment" }[o.close]
    };
  }
  function post(data) {
    return fetch(CONFIG.submitUrl, {
      method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data)
    }).then(function (r) { if (!r.ok) throw new Error("status " + r.status); });
  }
  // Try twice, then show the result anyway: someone who finished the quiz always sees their result.
  // Zapier gets the same lead as plain form fields, sent in a way browsers allow without a pre-check.
  function postHook(data) {
    var body = new URLSearchParams();
    Object.keys(data).forEach(function (k) { if (k.charAt(0) !== "_") body.append(k, data[k] == null ? "" : String(data[k])); });
    return fetch(CONFIG.hookUrl, { method: "POST", mode: "no-cors", keepalive: true, body: body }).catch(function () {});
  }
  function send(data) {
    var jobs = [];
    if (CONFIG.submitUrl) jobs.push(post(data).catch(function () { return post(data); }).catch(function () {}));
    if (CONFIG.hookUrl) jobs.push(postHook(data));
    if (!jobs.length) return Promise.resolve();
    var stop = new Promise(function (res) { setTimeout(res, 9000); });
    return Promise.race([Promise.all(jobs), stop]);
  }

  /* ---------- render ---------- */
  function render() {
    var i = state.step, kind = STEPS[i], screen;
    if (kind === "intro") screen = introScreen();
    else if (kind === "q") screen = scoredScreen(i - 1);
    else if (kind === "body") screen = bodyScreen();
    else if (kind === "sentence") screen = sentenceScreen();
    else if (kind === "next") screen = nextScreen();
    else if (kind === "gate") screen = gateScreen();
    else screen = resultScreen();
    stage.replaceChildren(screen);

    var inQuiz = i >= 1 && i <= TOTAL, atGate = kind === "gate";
    count.hidden = !inQuiz; bar.hidden = !(inQuiz || atGate);
    if (inQuiz) count.textContent = i + " of " + TOTAL;
    fill.style.width = atGate ? "100%" : Math.round((i / TOTAL) * 100) + "%";

    var head = screen.querySelector("h1");
    if (head) head.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    syncPreview();
  }

  /* ---------- preview strip ---------- */
  var CLOSES = { A: "Blueprint", C: "Call" };
  function syncPreview() {
    if (!CONFIG.preview) return;
    var onResult = state.step === RESULT_STEP, o = onResult ? outcome() : null;
    document.getElementById("preview-status").textContent = !onResult ? ""
      : (state.sampleVeto ? "This is a sample result for Susan." : "This result is from your own answers.");
    Array.prototype.forEach.call(document.querySelectorAll("#preview-vetoes .chip"), function (b) {
      b.setAttribute("aria-pressed", onResult && o.veto === b.dataset.v ? "true" : "false");
    });
    Array.prototype.forEach.call(document.querySelectorAll("#preview-closes .chip"), function (b) {
      b.setAttribute("aria-pressed", onResult && o.close === b.dataset.c ? "true" : "false");
    });
  }
  function setupPreview() {
    if (!CONFIG.preview) return;
    document.getElementById("preview").hidden = false;
    var vrow = document.getElementById("preview-vetoes"), crow = document.getElementById("preview-closes");
    ["V", "L", "E"].forEach(function (v) {
      vrow.append(h("button", { class: "chip", type: "button", "data-v": v, onclick: function () {
        state.sampleVeto = v; state.name = SAMPLE.name; state.sentence = SAMPLE.sentence; state.body = SAMPLE.body;
        go(RESULT_STEP);
      } }, NAMES[v].replace(" Veto", "")));
    });
    ["A", "C"].forEach(function (c) {
      crow.append(h("button", { class: "chip", type: "button", "data-c": c, onclick: function () {
        state.forceClose = c;
        if (state.step !== RESULT_STEP) {
          state.sampleVeto = state.sampleVeto || "V"; state.name = SAMPLE.name; state.sentence = SAMPLE.sentence; state.body = SAMPLE.body;
        }
        go(RESULT_STEP);
      } }, CLOSES[c]));
    });
    document.getElementById("preview-restart").addEventListener("click", function () { state = fresh(); render(); });
  }

  /* ---------- boot (keeps a viewer's place when the page is republished) ---------- */
  function start(saved) {
    if (saved && typeof saved.step === "number" && Array.isArray(saved.answers) && saved.answers.length === SCORED.length) {
      var base = fresh(), k;
      for (k in base) if (saved[k] !== undefined) base[k] = saved[k];
      state = base;
    }
    setupPreview();
    render();
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(function () { return state; }); } catch (e) {}
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
